name: ci
on:
  pull_request:
  push:
    branches: [research/r02-cloud-phase-1]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test,dashboard]"
      # Synthetic fixtures plus committed aggregate tables only; no downloads.
      - run: pytest -q
