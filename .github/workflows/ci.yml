name: ci
on:
  # PR events only: a branch push with an open PR otherwise triggers a duplicate run.
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -e ".[test]"  # deployment pins + package
      # Synthetic fixtures plus committed aggregate tables only; no downloads.
      - run: pytest -q
