name: ci
on:
  # Test pull requests and merged main; avoid duplicate feature-branch push runs.
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -e ".[test]"  # deployment pins + package
      # Synthetic fixtures plus committed aggregate tables only; no downloads.
      - run: pytest -q
