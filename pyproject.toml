[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbvintage"
version = "0.1.0"
description = "Release-vintage reliability of WHO provisional TB notification decline alerts (R02)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26", "matplotlib>=3.8", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
dashboard = ["streamlit>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
